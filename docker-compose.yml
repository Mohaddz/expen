services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/budget_tracker
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-to-a-secure-secret-at-least-32-chars}
      - BETTER_AUTH_URL=http://localhost:3000
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin123
      - S3_BUCKET=invoices
      - S3_REGION=us-east-1
      - OLLAMA_BASE_URL=http://ollama:11434
      - OCR_MODEL=glm-ocr:q8_0
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  rustfs-init:
    image: python:3.12-alpine
    command: >
      sh -c "pip install -q boto3 &&
      python -c \"
      import boto3, botocore
      s3 = boto3.client('s3', endpoint_url='http://rustfs:9000',
        aws_access_key_id='rustfsadmin', aws_secret_access_key='rustfsadmin123',
        region_name='us-east-1')
      try:
        s3.head_bucket(Bucket='invoices')
      except botocore.exceptions.ClientError:
        s3.create_bucket(Bucket='invoices')
        print('Created invoices bucket')
      else:
        print('Bucket already exists')
      \""
    depends_on:
      rustfs:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=budget_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5555:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin123
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
  ollama_data:
